<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1F4E3D">
    <title>Student Login — AVMS ABU Zaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <style>
        :root {
            --green-deep: #1F4E3D;
            --green-mid: #2D6B54;
            --gold: #C9A961;
            --gold-deep: #A88943;
            --red-deep: #8B1A1A;
            --cream: #F5F0DC;
            --cream-light: #FBF8EE;
            --border: #e3e0d2;
            --bg: #FBF8EE;
            --text: #1a1a1a;
            --text-soft: #6b6b6b;
            --field-bg: #F7F5EC;
            --card-bg: #ffffff;
        }

        body.dark {
            --bg: #0F1F19;
            --text: #E8E8E8;
            --text-soft: #A8A8A8;
            --field-bg: #1A2E24;
            --card-bg: #15271F;
            --border: #1F4E3D;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -120px;
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(201,169,97,0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -140px; left: -140px;
            width: 360px; height: 360px;
            background: radial-gradient(circle, rgba(45,107,84,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body.dark::before {
            background: radial-gradient(circle, rgba(201,169,97,0.08) 0%, transparent 70%);
        }
        body.dark::after {
            background: radial-gradient(circle, rgba(45,107,84,0.18) 0%, transparent 70%);
        }

        .app-screen {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            min-height: 32px;
        }
        .top-bar a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--green-deep);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 10px 6px 0;
        }
        body.dark .top-bar a { color: var(--gold); }
        .top-bar a i { font-size: 14px; }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-circle {
            width: 84px;
            height: 84px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--green-deep);
            box-shadow: 0 12px 28px rgba(31,78,61,0.22);
            overflow: hidden;
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .logo-wrap h1 {
            font-family: Georgia, serif;
            font-size: 24px;
            color: var(--green-deep);
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }
        body.dark .logo-wrap h1 { color: var(--gold); }
        .logo-wrap p {
            font-size: 13px;
            color: var(--text-soft);
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px 22px 24px;
            box-shadow: 0 12px 40px rgba(31,78,61,0.08), 0 2px 8px rgba(31,78,61,0.04);
            transition: background 0.3s;
        }
        body.dark .login-card {
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        .field {
            margin-bottom: 14px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--green-deep);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        body.dark .field-label { color: var(--gold); }
        .field-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--field-bg);
            border: 1.5px solid transparent;
            border-radius: 14px;
            padding: 0 16px;
            height: 54px;
            transition: border-color 0.18s, background 0.18s;
        }
        .field-input:focus-within {
            border-color: var(--green-mid);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(45,107,84,0.08);
        }
        body.dark .field-input:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201,169,97,0.15);
        }
        .field-input i {
            color: #8a8a8a;
            font-size: 15px;
            width: 18px;
            text-align: center;
        }
        .field-input input {
            flex: 1;
            border: none;
            background: transparent !important;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text);
            height: 100%;
        }
        .field-input input::placeholder { color: #a8a8a8; }

        .field-input input:-webkit-autofill,
        .field-input input:-webkit-autofill:hover,
        .field-input input:-webkit-autofill:focus,
        .field-input input:-webkit-autofill:active {
            -webkit-text-fill-color: var(--text) !important;
            -webkit-box-shadow: 0 0 0 1000px var(--field-bg) inset !important;
            box-shadow: 0 0 0 1000px var(--field-bg) inset !important;
            transition: background-color 9999s ease-in-out 0s;
            caret-color: var(--text);
        }
        body.dark .field-input input:-webkit-autofill,
        body.dark .field-input input:-webkit-autofill:hover,
        body.dark .field-input input:-webkit-autofill:focus,
        body.dark .field-input input:-webkit-autofill:active {
            -webkit-text-fill-color: #E8E8E8 !important;
            -webkit-box-shadow: 0 0 0 1000px #1A2E24 inset !important;
            box-shadow: 0 0 0 1000px #1A2E24 inset !important;
            caret-color: #E8E8E8;
        }

        @supports (-webkit-touch-callout: none) {
            .field-input input:-webkit-autofill {
                -webkit-text-fill-color: var(--text) !important;
                transition: background-color 9999s ease-in-out 0s;
            }
            body.dark .field-input input:-webkit-autofill {
                -webkit-text-fill-color: #E8E8E8 !important;
                background-color: #1A2E24 !important;
                transition: background-color 9999s ease-in-out 0s;
            }
        }

        .toggle-pw {
            background: none;
            border: none;
            color: #8a8a8a;
            cursor: pointer;
            padding: 6px;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            height: 54px;
            border-radius: 27px;
            background: var(--green-deep);
            color: #ffffff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            box-shadow: 0 8px 20px rgba(31,78,61,0.22);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary:hover:not(:disabled) { background: var(--green-mid); }

        .btn-outline {
            width: 100%;
            height: 54px;
            border-radius: 27px;
            background: transparent;
            color: var(--green-deep);
            border: 1.8px solid var(--green-deep);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        body.dark .btn-outline { color: var(--gold); border-color: var(--gold); }
        .btn-outline:active { transform: scale(0.98); }
        .btn-outline:hover { background: rgba(31,78,61,0.05); }
        body.dark .btn-outline:hover { background: rgba(201,169,97,0.1); }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-soft);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover { color: var(--green-deep); text-decoration: underline; }
        body.dark .forgot-link:hover { color: var(--gold); }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: #FBE9E9; color: var(--red-deep); border-left: 4px solid var(--red-deep); }
        .alert-warn { background: #FBF3DD; color: #6b4a05; border-left: 4px solid var(--gold); }
        .alert-success { background: #E8F3EC; color: var(--green-deep); border-left: 4px solid var(--green-mid); }
        body.dark .alert-error { background: #3A1A1A; color: #F0A0A0; }
        body.dark .alert-warn { background: #3A2E14; color: #F0D080; }
        body.dark .alert-success { background: #1A3A24; color: #A0E0A0; }

        /* Button inside alert for resending */
        .btn-resend {
            background: #1F4E3D;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-resend:hover:not(:disabled) { background: #2D6B54; }
        .btn-resend:disabled { opacity: 0.6; cursor: not-allowed; }
        body.dark .btn-resend { background: var(--gold); color: #0F1F19; }
        body.dark .btn-resend:hover:not(:disabled) { background: var(--gold-deep); }

        .app-footer {
            text-align: center;
            padding: 24px 0 0;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }
        .app-footer a { color: var(--green-deep); text-decoration: none; font-weight: 600; }
        body.dark .app-footer a { color: var(--gold); }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1200;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: var(--green-deep);
            color: var(--gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 6px 18px rgba(31,78,61,0.35);
            transition: transform 0.18s, background 0.18s, color 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover { background: var(--green-mid); transform: scale(1.06); }
        .theme-toggle:active { transform: scale(0.94); }
        @media (max-width: 768px) {
            .theme-toggle { bottom: 18px; right: 18px; width: 46px; height: 46px; }
        }

        @media (min-width: 640px) {
            .app-screen { padding-top: 48px; padding-bottom: 48px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="app-screen">

        <div class="top-bar">
            <a href="../index.html"><i class="fas fa-chevron-left"></i> Back to Site</a>
        </div>

        <div class="logo-wrap">
            <div class="logo-circle">
                <!-- POINTING TO THE SUPABASE STORAGE BUCKET -->
                <img src="https://tlkqzhudnpdnbxaltwbs.supabase.co/storage/v1/object/public/site-assets/logos/logo.svg" alt="AVMS Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'48\' fill=\'%231F4E3D\'/%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'43\' fill=\'none\' stroke=\'%23C9A961\' stroke-width=\'2.5\'/%3E%3Ctext x=\'50\' y=\'63\' font-size=\'34\' text-anchor=\'middle\' fill=\'%23C9A961\' font-family=\'Georgia, serif\' font-weight=\'bold\'%3EAV%3C/text%3E%3C/svg%3E'">
            </div>
            <h1>Student Portal</h1>
            <p>AVMS · ABU Zaria</p>
        </div>

        <div class="login-card">

            <div id="loginAlert" class="alert"></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="field-input">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-input">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <a href="../join.html" class="btn-outline">
                <i class="fas fa-user-plus"></i> Create new account
            </a>

            <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>

        </div>

        <div class="app-footer">
            &copy; <span id="year"></span> AVMS ABU Zaria<br>
            <a href="../index.html">Return to main site</a>
        </div>

    </div>

    <script>
        // ============================================
        // THEME TOGGLE
        // ============================================
        (function initTheme() {
            const saved = localStorage.getItem('avms-theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                const icon = document.querySelector('#themeToggle i');
                if (icon) icon.className = 'fas fa-sun';
            }
        })();

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('avms-theme', isDark ? 'dark' : 'light');
            const icon = this.querySelector('i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================
        // ELEMENTS
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const alertBox = document.getElementById('loginAlert');
        const togglePw = document.getElementById('togglePw');
        const forgotLink = document.getElementById('forgotLink');

        // ============================================
        // HELPERS
        // ============================================
        function showAlert(msg, type = 'error') {
            alertBox.className = 'alert alert-' + type + ' show';
            alertBox.innerHTML = msg;
        }
        function hideAlert() {
            alertBox.className = 'alert';
            alertBox.innerHTML = '';
        }
        function setLoading(on) {
            if (on) {
                loginBtn.disabled = true;
                loginBtnText.innerHTML = '<span class="spinner"></span> Signing in...';
            } else {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
            }
        }
        async function killSession() {
            try { await supabase.auth.signOut(); } catch (e) {}
        }

        // ============================================
        // AVATAR — sign + cache (45 min)
        // ============================================
        function extractStoragePath(input) {
            if (!input) return null;
            const str = String(input).trim();
            if (!str) return null;
            const marker = '/membership-documents/';
            const idx = str.indexOf(marker);
            if (idx !== -1) return str.substring(idx + marker.length);
            return str;
        }

        async function signAndCacheAvatar(userId) {
            try {
                const { data: app, error } = await supabase
                    .from('membership_applications')
                    .select('passport_photo_url')
                    .eq('auth_user_id', userId)
                    .order('applied_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                if (error || !app || !app.passport_photo_url) {
                    sessionStorage.removeItem('avms_avatar_url');
                    sessionStorage.removeItem('avms_avatar_expires');
                    return;
                }

                const path = extractStoragePath(app.passport_photo_url);
                if (!path) {
                    sessionStorage.removeItem('avms_avatar_url');
                    sessionStorage.removeItem('avms_avatar_expires');
                    return;
                }

                const { data: signed, error: signErr } = await supabase.storage
                    .from('membership-documents')
                    .createSignedUrl(path, 3600);

                if (signErr || !signed || !signed.signedUrl) {
                    sessionStorage.removeItem('avms_avatar_url');
                    sessionStorage.removeItem('avms_avatar_expires');
                    return;
                }

                sessionStorage.setItem('avms_avatar_url', signed.signedUrl);
                sessionStorage.setItem('avms_avatar_expires', String(Date.now() + 45 * 60 * 1000));
            } catch (e) {
                console.warn('Avatar signing failed (non-fatal):', e);
                sessionStorage.removeItem('avms_avatar_url');
                sessionStorage.removeItem('avms_avatar_expires');
            }
        }

        // ============================================
        // MAGIC LINK HANDLER (Approval Email)
        // ============================================
        async function handleMagicLink() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token=')) return;

            showAlert('🔐 Verifying login link...', 'success');
            form.style.display = 'none'; 

            try {
                const { data: { session }, error: sessErr } = await supabase.auth.getSession();
                
                if (sessErr || !session) {
                    throw new Error('Link expired or invalid.');
                }

                const userId = session.user.id;

                const { data: studentByAuth, error: stuErr } = await supabase
                    .from('students')
                    .select('id, is_active, reg_no')
                    .eq('auth_user_id', userId)
                    .maybeSingle();

                if (stuErr) throw stuErr;

                if (!studentByAuth) {
                    await killSession();
                    showAlert('⚠️ No student record linked to this account. Contact AVMS.', 'error');
                    form.style.display = 'block';
                    window.history.replaceState(null, '', window.location.pathname);
                    return;
                }

                if (studentByAuth.is_active !== true) {
                    await killSession();
                    showAlert('⏳ <strong>Application pending.</strong><br>Your account is awaiting admin approval. You\'ll receive an email once approved.', 'warn');
                    form.style.display = 'block';
                    window.history.replaceState(null, '', window.location.pathname);
                    return;
                }

                await signAndCacheAvatar(userId);
                showAlert('✅ Login successful. Redirecting...', 'success');
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.warn('Magic link error:', err);
                showAlert('⚠️ Login link is invalid or has expired. Please log in manually.', 'error');
                form.style.display = 'block';
                window.history.replaceState(null, '', window.location.pathname);
            }
        }

        handleMagicLink();

        // ============================================
        // SESSION HYGIENE
        // ============================================
        (async function cleanStaleSession() {
            if (typeof supabase === 'undefined' || !supabase) return;
            if (window.location.hash.includes('access_token=')) return;

            try {
                const { data: sess } = await supabase.auth.getSession();
                if (!sess || !sess.session) return;

                const userId = sess.session.user.id;

                const { data: byAuth } = await supabase
                    .from('students')
                    .select('id, is_active')
                    .eq('auth_user_id', userId)
                    .maybeSingle();

                if (!byAuth || byAuth.is_active !== true) {
                    await killSession();
                    try {
                        sessionStorage.removeItem('avms_avatar_url');
                        sessionStorage.removeItem('avms_avatar_expires');
                        localStorage.removeItem('adminLoggedIn');
                        sessionStorage.removeItem('adminLoggedIn');
                        sessionStorage.removeItem('adminSession');
                    } catch (e) {}
                }
            } catch (err) {
                await killSession();
            }
        })();

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        togglePw.addEventListener('click', function() {
            const isPw = passwordInput.type === 'password';
            passwordInput.type = isPw ? 'text' : 'password';
            togglePw.innerHTML = isPw ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        // ============================================
        // FORGOT PASSWORD
        // ============================================
        forgotLink.addEventListener('click', async function(e) {
            e.preventDefault();
            hideAlert();
            const email = (emailInput.value || '').trim();
            if (!email) {
                showAlert('Enter your email above first, then tap "Forgot Password?".', 'warn');
                emailInput.focus();
                return;
            }
            if (typeof supabase === 'undefined' || !supabase) {
                showAlert('Connection error. Please try again later.', 'error');
                return;
            }
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/student/login.html'
                });
                if (error) throw error;
                showAlert('✅ Password reset link sent to <strong>' + email + '</strong>. Check your inbox.', 'success');
            } catch (err) {
                showAlert('⚠️ ' + (err.message || 'Could not send reset email.'), 'error');
            }
        });

        // ============================================
        // RESEND CONFIRMATION LOGIC
        // ============================================
        async function handleResend(btn, email) {
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                const { error } = await supabase.auth.resend({
                    type: 'signup',
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/student/login.html'
                    }
                });

                if (error) throw error;

                showAlert('✅ New confirmation link sent to <strong>' + email + '</strong>. Check your inbox (and spam folder).', 'success');

                let timeLeft = 60;
                const timer = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.innerHTML = 'Resend confirmation email';
                    } else {
                        btn.innerHTML = `Resend in ${timeLeft}s...`;
                        timeLeft--;
                    }
                }, 1000);

            } catch (err) {
                let msg = err.message || 'Could not resend email.';
                if (msg.toLowerCase().includes('rate') || msg.toLowerCase().includes('too many')) {
                    msg = 'Please wait a minute before trying again.';
                }
                btn.innerHTML = originalText;
                btn.disabled = false;
                showAlert('⚠️ ' + msg, 'error');
            }
        }

        // ============================================
        // SUBMIT LOGIN
        // ============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const email = (emailInput.value || '').trim();
            const password = passwordInput.value || '';

            if (!email || !password) {
                showAlert('Please enter both your email and password.', 'warn');
                return;
            }

            if (typeof supabase === 'undefined' || !supabase) {
                showAlert('Connection error. Please try again later.', 'error');
                return;
            }

            setLoading(true);

            try {
                const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authErr) {
                    const msg = (authErr.message || '').toLowerCase();
                    
                    if (authErr.code === 'email_not_confirmed' || msg.includes('confirm') || msg.includes('verified')) {
                        alertBox.className = 'alert alert-warn show';
                        alertBox.innerHTML = `
                            ⚠️ <strong>Email not confirmed.</strong><br>
                            Please check your inbox for the confirmation link. It may have expired.<br><br>
                            <button type="button" class="btn-resend" id="resendBtn" onclick="handleResend(this, '${email}')">
                                Resend confirmation email
                            </button>
                        `;
                    } else if (msg.includes('invalid') || msg.includes('credentials')) {
                        showAlert('❌ Incorrect email or password. Please try again.', 'error');
                    } else {
                        showAlert('⚠️ ' + authErr.message, 'error');
                    }
                    setLoading(false);
                    return;
                }

                const userId = authData?.user?.id;
                if (!userId) {
                    showAlert('⚠️ Login succeeded but no user ID was returned. Contact AVMS.', 'error');
                    setLoading(false);
                    return;
                }

                const { data: studentByAuth, error: stuErr } = await supabase
                    .from('students')
                    .select('id, is_active, full_name, reg_no, class_level')
                    .eq('auth_user_id', userId)
                    .maybeSingle();

                if (stuErr) throw stuErr;

                if (!studentByAuth) {
                    await killSession();
                    showAlert('⚠️ No student record is linked to this account. Please contact AVMS.', 'error');
                    setLoading(false);
                    return;
                }

                if (studentByAuth.is_active !== true) {
                    await killSession();
                    showAlert('⏳ <strong>Application pending.</strong><br>Your account is awaiting admin approval. You\'ll receive an email once approved.', 'warn');
                    setLoading(false);
                    return;
                }

                const { data: studentByReg } = await supabase
                    .from('students')
                    .select('id, is_active')
                    .eq('reg_no', studentByAuth.reg_no)
                    .maybeSingle();

                if (!studentByReg || studentByReg.is_active !== true) {
                    await killSession();
                    showAlert('⚠️ Your student record was removed or deactivated. Please contact AVMS.', 'error');
                    setLoading(false);
                    return;
                }

                await signAndCacheAvatar(userId);

                showAlert('✅ Login successful. Redirecting...', 'success');
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.warn('Login error:', err);
                showAlert('⚠️ Something went wrong. Please try again.', 'error');
                setLoading(false);
            }
        });
    </script>
