<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1F4E3D">
    <title>Student Login — AVMS ABU Zaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <style>
        :root {
            --green-deep: #1F4E3D;
            --green-mid: #2D6B54;
            --gold: #C9A961;
            --gold-deep: #A88943;
            --red-deep: #8B1A1A;
            --cream: #F5F0DC;
            --cream-light: #FBF8EE;
            --border: #e3e0d2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FBF8EE;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Soft background blobs */
        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -120px;
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(201,169,97,0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -140px; left: -140px;
            width: 360px; height: 360px;
            background: radial-gradient(circle, rgba(45,107,84,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .app-screen {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
            min-height: 32px;
        }
        .top-bar a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--green-deep);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 10px 6px 0;
        }
        .top-bar a i { font-size: 14px; }

        /* LOGO */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--green-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(31,78,61,0.22);
            position: relative;
            margin-bottom: 18px;
        }
        .logo-circle::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            opacity: 0.85;
        }
        .logo-circle span {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
        }
        .logo-wrap h1 {
            font-family: Georgia, serif;
            font-size: 24px;
            color: var(--green-deep);
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }
        .logo-wrap p {
            font-size: 13px;
            color: #6b6b6b;
        }

        /* LOGIN CARD */
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 22px 24px;
            box-shadow: 0 12px 40px rgba(31,78,61,0.08), 0 2px 8px rgba(31,78,61,0.04);
        }

        .field {
            margin-bottom: 14px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--green-deep);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .field-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #F7F5EC;
            border: 1.5px solid transparent;
            border-radius: 14px;
            padding: 0 16px;
            height: 54px;
            transition: border-color 0.18s, background 0.18s;
        }
        .field-input:focus-within {
            border-color: var(--green-mid);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(45,107,84,0.08);
        }
        .field-input i {
            color: #8a8a8a;
            font-size: 15px;
            width: 18px;
            text-align: center;
        }
        .field-input input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #1a1a1a;
            height: 100%;
        }
        .field-input input::placeholder { color: #a8a8a8; }

        .toggle-pw {
            background: none;
            border: none;
            color: #8a8a8a;
            cursor: pointer;
            padding: 6px;
            font-size: 15px;
        }

        /* PRIMARY BUTTON */
        .btn-primary {
            width: 100%;
            height: 54px;
            border-radius: 27px;
            background: var(--green-deep);
            color: #ffffff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            box-shadow: 0 8px 20px rgba(31,78,61,0.22);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary:hover:not(:disabled) { background: var(--green-mid); }

        /* OUTLINED BUTTON */
        .btn-outline {
            width: 100%;
            height: 54px;
            border-radius: 27px;
            background: transparent;
            color: var(--green-deep);
            border: 1.8px solid var(--green-deep);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-outline:active { transform: scale(0.98); }
        .btn-outline:hover { background: rgba(31,78,61,0.05); }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #6b6b6b;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover { color: var(--green-deep); text-decoration: underline; }

        /* MESSAGES */
        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: #FBE9E9; color: var(--red-deep); border-left: 4px solid var(--red-deep); }
        .alert-warn { background: #FBF3DD; color: #6b4a05; border-left: 4px solid var(--gold); }
        .alert-success { background: #E8F3EC; color: var(--green-deep); border-left: 4px solid var(--green-mid); }

        /* FOOTER */
        .app-footer {
            text-align: center;
            padding: 24px 0 0;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }
        .app-footer a { color: var(--green-deep); text-decoration: none; font-weight: 600; }

        /* SPINNER */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* DESKTOP NICE-TO-HAVE */
        @media (min-width: 640px) {
            .app-screen { padding-top: 48px; padding-bottom: 48px; }
        }
    </style>
</head>
<body>

    <div class="app-screen">

        <!-- TOP BAR -->
        <div class="top-bar">
            <a href="../index.html"><i class="fas fa-chevron-left"></i> Back to Site</a>
        </div>

        <!-- LOGO -->
        <div class="logo-wrap">
            <div class="logo-circle"><span>AV</span></div>
            <h1>Student Portal</h1>
            <p>AVMS · ABU Zaria</p>
        </div>

        <!-- LOGIN CARD -->
        <div class="login-card">

            <div id="loginAlert" class="alert"></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="field-input">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-input">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <a href="../join.html" class="btn-outline">
                <i class="fas fa-user-plus"></i> Create new account
            </a>

            <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>

        </div>

        <!-- FOOTER -->
        <div class="app-footer">
            &copy; <span id="year"></span> AVMS ABU Zaria<br>
            <a href="../index.html">Return to main site</a>
        </div>

    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================
        // ELEMENTS
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const alertBox = document.getElementById('loginAlert');
        const togglePw = document.getElementById('togglePw');
        const forgotLink = document.getElementById('forgotLink');

        // ============================================
        // HELPERS
        // ============================================
        function showAlert(msg, type = 'error') {
            alertBox.className = 'alert alert-' + type + ' show';
            alertBox.innerHTML = msg;
        }
        function hideAlert() {
            alertBox.className = 'alert';
            alertBox.innerHTML = '';
        }
        function setLoading(on) {
            if (on) {
                loginBtn.disabled = true;
                loginBtnText.innerHTML = '<span class="spinner"></span> Signing in...';
            } else {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
            }
        }

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        togglePw.addEventListener('click', function() {
            const isPw = passwordInput.type === 'password';
            passwordInput.type = isPw ? 'text' : 'password';
            togglePw.innerHTML = isPw ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        // ============================================
        // FORGOT PASSWORD
        // ============================================
        forgotLink.addEventListener('click', async function(e) {
            e.preventDefault();
            hideAlert();
            const email = (emailInput.value || '').trim();
            if (!email) {
                showAlert('Enter your email above first, then tap "Forgot Password?".', 'warn');
                emailInput.focus();
                return;
            }
            if (typeof supabase === 'undefined' || !supabase) {
                showAlert('Connection error. Please try again later.', 'error');
                return;
            }
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/student/login.html'
                });
                if (error) throw error;
                showAlert('✅ Password reset link sent to <strong>' + email + '</strong>. Check your inbox.', 'success');
            } catch (err) {
                showAlert('⚠️ ' + (err.message || 'Could not send reset email.'), 'error');
            }
        });

        // ============================================
        // SUBMIT LOGIN
        // ============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const email = (emailInput.value || '').trim();
            const password = passwordInput.value || '';

            if (!email || !password) {
                showAlert('Please enter both your email and password.', 'warn');
                return;
            }

            if (typeof supabase === 'undefined' || !supabase) {
                showAlert('Connection error. Please try again later.', 'error');
                return;
            }

            setLoading(true);

            try {
                // 1) Sign in
                const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authErr) {
                    // Friendly messages
                    const msg = (authErr.message || '').toLowerCase();
                    if (msg.includes('invalid') || msg.includes('credentials')) {
                        showAlert('❌ Incorrect email or password. Please try again.', 'error');
                    } else if (msg.includes('confirm')) {
                        showAlert('⚠️ Please confirm your email first. Check your inbox.', 'warn');
                    } else {
                        showAlert('⚠️ ' + authErr.message, 'error');
                    }
                    setLoading(false);
                    return;
                }

                const userId = authData?.user?.id;
                if (!userId) {
                    showAlert('⚠️ Login succeeded but no user ID was returned. Contact AVMS.', 'error');
                    setLoading(false);
                    return;
                }

                // 2) Check student record
                const { data: student, error: stuErr } = await supabase
                    .from('students')
                    .select('id, is_active, full_name, reg_no, class_level')
                    .eq('auth_user_id', userId)
                    .maybeSingle();

                if (stuErr) throw stuErr;

                if (!student) {
                    // No roster record linked — sign them out
                    await supabase.auth.signOut();
                    showAlert('⚠️ No student record is linked to this account. Please contact AVMS.', 'error');
                    setLoading(false);
                    return;
                }

                if (student.is_active !== true) {
                    // Account exists but not approved
                    await supabase.auth.signOut();
                    showAlert('⏳ <strong>Application pending.</strong><br>Your account is awaiting admin approval. You\'ll receive an email once approved.', 'warn');
                    setLoading(false);
                    return;
                }

                // 3) Approved — redirect to dashboard
                showAlert('✅ Login successful. Redirecting...', 'success');
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.warn('Login error:', err);
                showAlert('⚠️ Something went wrong. Please try again.', 'error');
                setLoading(false);
            }
        });
    </script>

</body>
</html>
