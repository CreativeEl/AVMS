<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Results - AVMS CBT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script>
        (function(){
            try {
                var t = localStorage.getItem('avms-theme') || 'light';
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch(e){}
        })();
    </script>
    <style>
        :root {
            --bg: #F5F0DC;
            --surface: #ffffff;
            --surface-2: #FBF8EE;
            --text: #1a1a1a;
            --text-soft: #666;
            --text-muted: #888;
            --border: #e3e0d2;
            --border-hair: #f0ede0;
            --icon-bg: #F7F5EC;
            --hover-bg: #F5F0DC;
            --option-bg: #FBF8EE;
            --option-letter-bg: #e3e0d2;
            --option-letter-text: #555;
        }

        html.dark {
            --bg: #0f1714;
            --surface: #182420;
            --surface-2: #1e2c26;
            --text: #e8f0ea;
            --text-soft: #a8b5ac;
            --text-muted: #7a8a80;
            --border: #24352e;
            --border-hair: #1e2c26;
            --icon-bg: #1e2c26;
            --hover-bg: #1e2c26;
            --option-bg: #1e2c26;
            --option-letter-bg: #24352e;
            --option-letter-text: #a8b5ac;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* TOP BAR */
        .topbar {
            background: #1F4E3D;
            color: white;
            padding: 15px 0;
            box-shadow: 0 2px 10px rgba(31,78,61,0.2);
            border-bottom: 3px solid #C9A961;
        }
        html.dark .topbar { background: #0a120f; }
        .topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .topbar-brand .icon {
            width: 42px;
            height: 42px;
            background: rgba(201,169,97,0.15);
            border: 2px solid #C9A961;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .topbar-brand .text h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            font-weight: 700;
        }
        .topbar-brand .text p {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.22); }
        .theme-toggle:active { transform: scale(0.94); }
        .btn-dashboard {
            background: #C9A961;
            color: #1F4E3D;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-dashboard:hover {
            background: #A88943;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201,169,97,0.35);
        }

        /* MAIN */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* SCORE CARD */
        .score-card {
            background: linear-gradient(135deg, #1F4E3D 0%, #2D6B54 100%);
            color: white;
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            text-align: center;
            border-top: 4px solid #C9A961;
        }
        html.dark .score-card {
            background: linear-gradient(135deg, #0a120f 0%, #122620 100%);
        }
        .score-card::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(201,169,97,0.1);
            border-radius: 50%;
        }
        .score-card-inner {
            position: relative;
            z-index: 1;
        }

        .result-emoji {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .result-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .result-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 25px;
        }

        .score-circle-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(201,169,97,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid #C9A961;
            box-shadow: 0 0 0 8px rgba(201,169,97,0.08);
        }
        .score-percent {
            font-size: 44px;
            font-weight: 800;
            line-height: 1;
            color: #C9A961;
        }
        .score-percent-label {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            margin-top: 5px;
        }

        .result-label {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .result-label.pass {
            background: #28a745;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .result-label.fail {
            background: #8B1A1A;
            box-shadow: 0 4px 15px rgba(139, 26, 26, 0.4);
        }

        .score-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            font-size: 14px;
            margin-top: 10px;
        }
        .score-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.9);
        }
        .score-meta-item i {
            color: #C9A961;
        }

        /* STATS ROW */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--border);
            border-top: 4px solid #2D6B54;
            box-shadow: 0 1px 3px rgba(31,78,61,0.05);
            transition: background 0.3s, border-color 0.3s;
        }
        .stat-card.correct { border-top-color: #28a745; }
        .stat-card.wrong { border-top-color: #dc3545; }
        .stat-card.skipped { border-top-color: #888; }
        .stat-card i {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .stat-card.correct i { color: #28a745; }
        .stat-card.wrong i { color: #dc3545; }
        .stat-card.skipped i { color: #888; }
        html.dark .stat-card.skipped i { color: #a8b5ac; }
        .stat-card h3 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 30px;
            color: var(--text);
            font-weight: 800;
            margin-bottom: 4px;
        }
        html.dark .stat-card h3 { color: #C9A961; }
        .stat-card p {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ACTION BUTTONS */
        .actions-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .btn-action {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary {
            background: #2D6B54;
            color: white;
        }
        .btn-primary:hover {
            background: #1F4E3D;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31,78,61,0.35);
        }
        .btn-secondary {
            background: #8B1A1A;
            color: white;
        }
        .btn-secondary:hover {
            background: #6F1414;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139,26,26,0.3);
        }
        .btn-ghost {
            background: var(--surface);
            color: var(--text);
            border: 2px solid #1F4E3D;
        }
        html.dark .btn-ghost {
            color: #C9A961;
            border-color: #C9A961;
        }
        .btn-ghost:hover {
            background: var(--hover-bg);
            border-color: #C9A961;
        }

        /* REVIEW SECTION */
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .review-header h2 {
            font-family: Georgia, 'Times New Roman', serif;
            color: var(--text);
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        html.dark .review-header h2 { color: #C9A961; }
        .review-header h2 i { color: #C9A961; }

        .review-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-pill {
            padding: 8px 18px;
            border: 2px solid var(--border);
            background: var(--surface);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text-soft);
        }
        .filter-pill:hover {
            border-color: #C9A961;
            color: var(--text);
        }
        .filter-pill.active {
            background: #1F4E3D;
            color: white;
            border-color: #1F4E3D;
        }
        html.dark .filter-pill.active {
            background: #C9A961;
            color: #1a1a1a;
            border-color: #C9A961;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .review-item {
            background: var(--surface);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid var(--border);
            border-left: 5px solid var(--border);
            box-shadow: 0 1px 3px rgba(31,78,61,0.05);
            transition: background 0.3s, border-color 0.3s;
        }
        .review-item.correct { border-left-color: #28a745; }
        .review-item.wrong { border-left-color: #dc3545; }
        .review-item.skipped { border-left-color: #888; }

        .review-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .review-item-number {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .review-status-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .review-status-badge.correct { background: #d4edda; color: #155724; }
        .review-status-badge.wrong { background: #f8d7da; color: #721c24; }
        .review-status-badge.skipped { background: #e2e3e5; color: #383d41; }
        html.dark .review-status-badge.correct { background: rgba(40,167,69,0.2); color: #9ddfa6; }
        html.dark .review-status-badge.wrong { background: rgba(220,53,69,0.2); color: #ff8a8a; }
        html.dark .review-status-badge.skipped { background: rgba(136,136,136,0.2); color: #a8b5ac; }

        .review-question {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 18px;
        }
        html.dark .review-question { color: #e8f0ea; }

        .review-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }
        .review-option {
            padding: 12px 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            background: var(--option-bg);
            border: 2px solid var(--border);
            color: var(--text);
        }
        .review-option .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--option-letter-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
            color: var(--option-letter-text);
        }
        .review-option.is-correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        html.dark .review-option.is-correct {
            background: rgba(40,167,69,0.15);
            color: #9ddfa6;
            border-color: #28a745;
        }
        .review-option.is-correct .option-letter {
            background: #28a745;
            color: white;
        }
        .review-option.user-chose-wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        html.dark .review-option.user-chose-wrong {
            background: rgba(220,53,69,0.15);
            color: #ff8a8a;
            border-color: #dc3545;
        }
        .review-option.user-chose-wrong .option-letter {
            background: #dc3545;
            color: white;
        }
        .review-option.user-chose-correct {
            background: #d4edda;
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
        }
        html.dark .review-option.user-chose-correct {
            background: rgba(40,167,69,0.15);
            color: #9ddfa6;
        }

        .option-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .option-tag.correct-tag { background: #28a745; color: white; }
        .option-tag.your-tag { background: #2D6B54; color: white; }
        .option-tag.wrong-tag { background: #dc3545; color: white; }

        .solution-box {
            background: var(--surface-2);
            border-left: 4px solid #C9A961;
            padding: 15px 18px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .solution-box-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        html.dark .solution-box-header { color: #C9A961; }
        .solution-box-header i { color: #C9A961; }
        .solution-box p {
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
        }

        .user-answer-note {
            font-size: 13px;
            color: var(--text-soft);
            margin-top: 10px;
        }
        .user-answer-note strong {
            color: var(--text);
        }
        html.dark .user-answer-note strong { color: #C9A961; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(31,78,61,0.05);
        }
        .empty-state i {
            font-size: 50px;
            color: #C9A961;
            opacity: 0.5;
            margin-bottom: 15px;
            display: block;
        }

        @media (max-width: 640px) {
            .score-card { padding: 30px 20px; }
            .result-title { font-size: 22px; }
            .result-emoji { font-size: 45px; }
            .score-circle { width: 130px; height: 130px; }
            .score-percent { font-size: 34px; }
            .score-meta { gap: 15px; font-size: 12px; }
            .review-item { padding: 20px 15px; }
            .review-question { font-size: 15px; }
            .actions-row { flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; }
        }

        @media print {
            body { background: white; color: #1a1a1a; }
            .topbar, .actions-row, .review-filters, .theme-toggle { display: none !important; }
            .score-card {
                background: #1F4E3D !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .stat-card, .review-item, .review-option, .solution-box {
                background: white !important;
                color: #1a1a1a !important;
                border-color: #e3e0d2 !important;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-inner">
            <a href="#" id="topbarBrandLink" class="topbar-brand">
                <div class="icon">🎓</div>
                <div class="text">
                    <h1>AVMS CBT Results</h1>
                    <p>Association of Veterinary Medical Students</p>
                </div>
            </a>
            <div class="topbar-actions">
                <button class="theme-toggle" id="themeBtn" aria-label="Toggle dark mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <a href="#" id="topbarBackBtn" class="btn-dashboard">
                    <i class="fas fa-arrow-left"></i> <span id="topbarBackLabel">Back to Dashboard</span>
                </a>
            </div>
        </div>
    </div>

    <div class="main" id="mainContent">
        <!-- Populated by JS -->
    </div>

    <script>
        // ============================================
        // THEME
        // ============================================
        function applyThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('avms-theme', isDark ? 'dark' : 'light'); } catch(e){}
            applyThemeIcon();
        }
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        applyThemeIcon();

        // ============================================
        // SESSION CHECK
        // ============================================
        const studentJson = sessionStorage.getItem('cbt_student');
        const resultJson = sessionStorage.getItem('cbt_last_result');
        const modeJson = sessionStorage.getItem('cbt_current_mode');

        if (!studentJson) {
            window.location.href = 'login.html';
            throw new Error('No session');
        }
        if (!resultJson) {
            alert('No result found. Redirecting to dashboard.');
            window.location.href = 'dashboard.html';
            throw new Error('No result');
        }

        const student = JSON.parse(studentJson);
        const result = JSON.parse(resultJson);

        // ============================================
        // SMART BACK NAVIGATION
        // ============================================
        // Determine where the test was started from
        let startedFrom = 'dashboard';
        if (modeJson) {
            try {
                const modeConfig = JSON.parse(modeJson);
                startedFrom = modeConfig.started_from || 'dashboard';
            } catch (e) {}
        }

        let backUrl = 'dashboard.html';
        let backLabel = 'Back to Dashboard';

        if (startedFrom === 'portal') {
            backUrl = '../student/cbt.html';
            backLabel = 'Back to CBT Hub';
        }

        // Apply to topbar link
        document.getElementById('topbarBackBtn').href = backUrl;
        document.getElementById('topbarBackLabel').textContent = backLabel;
        document.getElementById('topbarBrandLink').href = backUrl;

        // ============================================
        // STATE
        // ============================================
        let currentFilter = 'all';

        // ============================================
        // HELPERS
        // ============================================
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}m ${secs}s`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================
        // COMPUTE SUMMARY
        // ============================================
        let correctCount = 0;
        let wrongCount = 0;
        let skippedCount = 0;

        result.answers.forEach(a => {
            if (!a.user_answer) skippedCount++;
            else if (a.is_correct) correctCount++;
            else wrongCount++;
        });

        const percentage = result.percentage;
        const passed = percentage >= 50;

        // ============================================
        // EMOJI + MESSAGE
        // ============================================
        let emoji, title, subtitle;
        if (percentage >= 80) {
            emoji = '🏆';
            title = 'Excellent!';
            subtitle = 'Outstanding performance — you nailed it!';
        } else if (percentage >= 65) {
            emoji = '🎉';
            title = 'Great Job!';
            subtitle = 'Solid work — keep it up!';
        } else if (percentage >= 50) {
            emoji = '👍';
            title = 'Good Effort!';
            subtitle = 'You passed — but there\'s room to improve.';
        } else if (percentage >= 30) {
            emoji = '📚';
            title = 'Keep Practicing';
            subtitle = 'Review the solutions below and try again.';
        } else {
            emoji = '💪';
            title = 'Don\'t Give Up!';
            subtitle = 'Study the solutions carefully, then retake the test.';
        }

        // ============================================
        // BUILD MAIN CONTENT
        // ============================================
        const main = document.getElementById('mainContent');

        main.innerHTML = `
            <div class="score-card">
                <div class="score-card-inner">
                    <span class="result-emoji">${emoji}</span>
                    <div class="result-title">${title}</div>
                    <div class="result-subtitle">${subtitle}</div>

                    <div class="score-circle-wrap">
                        <div class="score-circle">
                            <div class="score-percent">${percentage}%</div>
                            <div class="score-percent-label">${result.score} / ${result.total}</div>
                        </div>
                    </div>

                    <div class="result-label ${passed ? 'pass' : 'fail'}">
                        ${passed ? '✓ Passed' : '✗ Failed'}
                    </div>

                    <div class="score-meta">
                        <div class="score-meta-item">
                            <i class="fas fa-book"></i>
                            <span>${escapeHtml(result.course_code)} — ${escapeHtml(result.course_name)}</span>
                        </div>
                        <div class="score-meta-item">
                            <i class="fas fa-clock"></i>
                            <span>Time used: ${formatTime(result.time_taken_seconds)}</span>
                        </div>
                        <div class="score-meta-item">
                            <i class="fas fa-${result.mode === 'exam' ? 'clipboard-list' : 'pen'}"></i>
                            <span>${result.mode === 'exam' ? 'Exam' : 'Practice Test'}</span>
                        </div>
                        ${result.auto_submitted ? `
                            <div class="score-meta-item" style="color: #ffc107;">
                                <i class="fas fa-exclamation-triangle" style="color: #ffc107;"></i>
                                <span>Auto-submitted (time up / left page)</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card correct">
                    <i class="fas fa-check-circle"></i>
                    <h3>${correctCount}</h3>
                    <p>Correct</p>
                </div>
                <div class="stat-card wrong">
                    <i class="fas fa-times-circle"></i>
                    <h3>${wrongCount}</h3>
                    <p>Wrong</p>
                </div>
                <div class="stat-card skipped">
                    <i class="fas fa-minus-circle"></i>
                    <h3>${skippedCount}</h3>
                    <p>Skipped</p>
                </div>
            </div>

            <div class="actions-row">
                <button class="btn-action btn-primary" onclick="retake()">
                    <i class="fas fa-redo"></i> Retake ${result.mode === 'exam' ? 'Exam' : 'Test'}
                </button>
                <a href="${backUrl}" class="btn-action btn-secondary">
                    <i class="fas fa-home"></i> ${backLabel}
                </a>
                <button class="btn-action btn-ghost" onclick="window.print()">
                    <i class="fas fa-print"></i> Print Results
                </button>
            </div>

            <div class="review-header">
                <h2><i class="fas fa-search"></i> Review Answers</h2>
                <div class="review-filters">
                    <button class="filter-pill active" onclick="filterReview('all', this)">All (${result.total})</button>
                    <button class="filter-pill" onclick="filterReview('correct', this)">✓ Correct (${correctCount})</button>
                    <button class="filter-pill" onclick="filterReview('wrong', this)">✗ Wrong (${wrongCount})</button>
                    <button class="filter-pill" onclick="filterReview('skipped', this)">− Skipped (${skippedCount})</button>
                </div>
            </div>

            <div class="review-list" id="reviewList"></div>
        `;

        // ============================================
        // RENDER REVIEW LIST
        // ============================================
        function renderReview() {
            const list = document.getElementById('reviewList');
            let filtered = result.answers;

            if (currentFilter === 'correct') filtered = filtered.filter(a => a.is_correct);
            else if (currentFilter === 'wrong') filtered = filtered.filter(a => a.user_answer && !a.is_correct);
            else if (currentFilter === 'skipped') filtered = filtered.filter(a => !a.user_answer);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No questions match this filter.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map((a) => {
                const originalIndex = result.answers.indexOf(a) + 1;
                let statusClass, statusIcon, statusText;
                if (!a.user_answer) {
                    statusClass = 'skipped';
                    statusIcon = 'fa-minus-circle';
                    statusText = 'Skipped';
                } else if (a.is_correct) {
                    statusClass = 'correct';
                    statusIcon = 'fa-check-circle';
                    statusText = 'Correct';
                } else {
                    statusClass = 'wrong';
                    statusIcon = 'fa-times-circle';
                    statusText = 'Wrong';
                }

                const optionsHtml = a.options.map(opt => {
                    const isCorrect = opt.letter === a.correct_answer;
                    const isUserChoice = opt.letter === a.user_answer;
                    let cls = '';
                    let tag = '';

                    if (isCorrect && isUserChoice) {
                        cls = 'is-correct user-chose-correct';
                        tag = '<span class="option-tag correct-tag">✓ Your Answer (Correct)</span>';
                    } else if (isCorrect) {
                        cls = 'is-correct';
                        tag = '<span class="option-tag correct-tag">✓ Correct Answer</span>';
                    } else if (isUserChoice) {
                        cls = 'user-chose-wrong';
                        tag = '<span class="option-tag wrong-tag">✗ Your Answer</span>';
                    }

                    return `
                        <div class="review-option ${cls}">
                            <div class="option-letter">${opt.letter}</div>
                            <div>${escapeHtml(opt.text)}</div>
                            ${tag}
                        </div>
                    `;
                }).join('');

                const userAnswerNote = a.user_answer
                    ? `<div class="user-answer-note">You chose <strong>${escapeHtml(a.user_answer)}</strong>. Correct answer is <strong>${escapeHtml(a.correct_answer)}</strong>.</div>`
                    : `<div class="user-answer-note">You did not answer this question. Correct answer is <strong>${escapeHtml(a.correct_answer)}</strong>.</div>`;

                const solutionHtml = a.solution
                    ? `
                        <div class="solution-box">
                            <div class="solution-box-header">
                                <i class="fas fa-lightbulb"></i> Solution
                            </div>
                            <p>${escapeHtml(a.solution)}</p>
                        </div>
                    `
                    : '';

                return `
                    <div class="review-item ${statusClass}">
                        <div class="review-item-header">
                            <span class="review-item-number">Question ${originalIndex}</span>
                            <span class="review-status-badge ${statusClass}">
                                <i class="fas ${statusIcon}"></i> ${statusText}
                            </span>
                        </div>
                        <div class="review-question">${escapeHtml(a.question)}</div>
                        <div class="review-options">${optionsHtml}</div>
                        ${userAnswerNote}
                        ${solutionHtml}
                    </div>
                `;
            }).join('');
        }

        function filterReview(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderReview();
        }

        function retake() {
            const storageKey = `cbt_test_${result.course_id}_${result.mode}`;
            localStorage.removeItem(storageKey);
            sessionStorage.removeItem('cbt_last_result');
            // NOTE: we do NOT clear cbt_current_mode here so retake keeps the same origin.

            const goTo = result.mode === 'exam' ? 'exam.html' : 'test.html';
            window.location.href = goTo;
        }

        // ============================================
        // INIT
        // ============================================
        renderReview();
    </script>
</body>
</html>
