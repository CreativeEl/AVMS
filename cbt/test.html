<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Test in Progress - AVMS CBT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script>
        (function(){
            try {
                var t = localStorage.getItem('avms-theme') || 'light';
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch(e){}
        })();
    </script>
    <style>
        :root {
            --bg: #F5F0DC;
            --surface: #ffffff;
            --surface-2: #FBF8EE;
            --text: #1a1a1a;
            --text-soft: #666;
            --text-muted: #888;
            --border: #e3e0d2;
            --border-hair: #f0ede0;
            --icon-bg: #F7F5EC;
            --hover-bg: #F5F0DC;
            --option-bg: #FBF8EE;
            --option-letter-bg: #e3e0d2;
            --option-letter-text: #555;
            --nav-btn-bg: #ffffff;
        }

        html.dark {
            --bg: #0f1714;
            --surface: #182420;
            --surface-2: #1e2c26;
            --text: #e8f0ea;
            --text-soft: #a8b5ac;
            --text-muted: #7a8a80;
            --border: #24352e;
            --border-hair: #1e2c26;
            --icon-bg: #1e2c26;
            --hover-bg: #1e2c26;
            --option-bg: #1e2c26;
            --option-letter-bg: #24352e;
            --option-letter-text: #a8b5ac;
            --nav-btn-bg: #1e2c26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* TOP BAR */
        .test-topbar {
            background: #1F4E3D;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 500;
            box-shadow: 0 2px 10px rgba(31,78,61,0.2);
            border-bottom: 3px solid #C9A961;
        }
        html.dark .test-topbar { background: #0a120f; }
        .test-topbar .left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .test-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-title i { color: #C9A961; }

        .timer-box {
            background: rgba(201,169,97,0.15);
            border: 2px solid #C9A961;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-variant-numeric: tabular-nums;
        }
        .timer-box i { color: #C9A961; }
        .timer-box.warning {
            background: #8B1A1A;
            border-color: #8B1A1A;
            animation: pulse 1s infinite;
        }
        .timer-box.warning i { color: white; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139, 26, 26, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(139, 26, 26, 0); }
        }

        .progress-info {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-info strong { color: white; }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.22); }
        .theme-toggle:active { transform: scale(0.94); }

        /* WARNING BANNER */
        .warning-banner {
            background: #8B1A1A;
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }
        .warning-banner.show { display: flex; }
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        /* MAIN LAYOUT */
        .test-main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px 20px 100px;
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 25px;
            align-items: start;
        }

        /* QUESTION PANEL */
        .question-panel {
            background: var(--surface);
            border-radius: 15px;
            padding: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(31,78,61,0.05);
            border-top: 4px solid #C9A961;
            transition: background 0.3s, border-color 0.3s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-hair);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .question-number {
            font-size: 13px;
            font-weight: 700;
            color: #2D6B54;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        html.dark .question-number { color: #C9A961; }
        .difficulty-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .difficulty-badge.easy { background: #d4edda; color: #155724; }
        .difficulty-badge.medium { background: #fff3cd; color: #856404; }
        .difficulty-badge.hard { background: #f8d7da; color: #721c24; }

        .question-text {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 19px;
            font-weight: 600;
            color: #1F4E3D;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        html.dark .question-text { color: var(--text); }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 20px;
            background: var(--option-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-item:hover {
            border-color: #C9A961;
            background: var(--hover-bg);
        }
        .option-item.selected {
            border-color: #C9A961;
            background: var(--hover-bg);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.2);
        }
        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--option-letter-bg);
            color: var(--option-letter-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .option-item.selected .option-letter {
            background: #2D6B54;
            color: white;
        }
        .option-text {
            font-size: 15px;
            color: var(--text);
            line-height: 1.5;
            flex-grow: 1;
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid var(--border-hair);
        }
        .btn-nav {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-prev {
            background: var(--option-bg);
            color: var(--text-soft);
            border: 2px solid var(--border);
        }
        .btn-prev:hover:not(:disabled) {
            background: var(--hover-bg);
            border-color: #C9A961;
            color: var(--text);
        }
        .btn-next {
            background: #2D6B54;
            color: white;
        }
        .btn-next:hover:not(:disabled) {
            background: #1F4E3D;
            transform: translateX(3px);
            box-shadow: 0 4px 12px rgba(31,78,61,0.2);
        }
        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-submit {
            background: #2D6B54;
            color: white;
            padding: 12px 30px;
        }
        .btn-submit:hover {
            background: #1F4E3D;
            box-shadow: 0 4px 12px rgba(31,78,61,0.2);
        }

        /* SIDEBAR */
        .sidebar-panel {
            position: sticky;
            top: 90px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .navigator-card {
            background: var(--surface);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(31,78,61,0.05);
            transition: background 0.3s, border-color 0.3s;
        }
        .navigator-card h3 {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        html.dark .navigator-card h3 { color: #C9A961; }
        .navigator-card h3 i { color: #C9A961; }

        .navigator-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .nav-btn {
            aspect-ratio: 1;
            border: 2px solid var(--border);
            background: var(--nav-btn-bg);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-soft);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            border-color: #C9A961;
            color: var(--text);
        }
        .nav-btn.answered {
            background: #2D6B54;
            border-color: #2D6B54;
            color: white;
        }
        .nav-btn.current {
            background: #C9A961;
            border-color: #C9A961;
            color: #1F4E3D;
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(201, 169, 97, 0.4);
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-hair);
            font-size: 12px;
            color: var(--text-soft);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid var(--border);
        }
        .legend-dot.answered {
            background: #2D6B54;
            border-color: #2D6B54;
        }
        .legend-dot.current {
            background: #C9A961;
            border-color: #C9A961;
        }
        .legend-dot.unanswered {
            background: var(--nav-btn-bg);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            color: var(--text-soft);
        }
        .stat-row strong {
            color: var(--text);
        }
        html.dark .stat-row strong { color: #C9A961; }

        /* CALCULATOR */
        .calc-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2D6B54;
            color: white;
            border: 2px solid #C9A961;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(31, 78, 61, 0.4);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .calc-btn:hover {
            background: #1F4E3D;
            transform: scale(1.1);
        }

        .calculator {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 300px;
            background: #1F4E3D;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid #C9A961;
            z-index: 1000;
            display: none;
            overflow: hidden;
            color: white;
        }
        .calculator.show { display: block; }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #163829;
            cursor: move;
            user-select: none;
            border-bottom: 1px solid rgba(201,169,97,0.3);
        }
        .calc-header span {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calc-header span i { color: #C9A961; }
        .calc-header .calc-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }
        .calc-header .calc-close:hover { color: #C9A961; }

        .calc-display {
            background: #163829;
            padding: 20px 15px;
            text-align: right;
            font-size: 26px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
            white-space: nowrap;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            color: #C9A961;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(201,169,97,0.3);
        }

        .calc-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #1F4E3D;
            padding: 1px;
        }
        .calc-key {
            background: #1F4E3D;
            color: white;
            border: none;
            padding: 18px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .calc-key:hover { background: #2D6B54; }
        .calc-key.operator {
            background: #2D6B54;
            color: white;
        }
        .calc-key.operator:hover { background: #3d8068; }
        .calc-key.equals {
            background: #C9A961;
            color: #1F4E3D;
            grid-row: span 2;
            font-weight: 700;
        }
        .calc-key.equals:hover { background: #A88943; }
        .calc-key.clear {
            background: #8B1A1A;
            color: white;
        }
        .calc-key.clear:hover { background: #6F1414; }
        .calc-key.zero {
            grid-column: span 2;
        }

        /* SUBMIT MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20,47,37,0.6);
            backdrop-filter: blur(3px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--surface);
            border-radius: 15px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border-top: 4px solid #C9A961;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .modal-box .icon {
            width: 70px;
            height: 70px;
            background: var(--hover-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            color: #C9A961;
            border: 2px solid #C9A961;
        }
        .modal-box h3 {
            font-family: Georgia, 'Times New Roman', serif;
            color: var(--text);
            font-size: 20px;
            margin-bottom: 10px;
        }
        html.dark .modal-box h3 { color: #C9A961; }
        .modal-box p {
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-box .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-box .modal-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .modal-box .btn-cancel {
            background: transparent;
            color: var(--text-soft);
            border: 2px solid var(--border);
        }
        .modal-box .btn-cancel:hover {
            background: var(--hover-bg);
            border-color: var(--text-soft);
        }
        .modal-box .btn-confirm {
            background: #2D6B54;
            color: white;
        }
        .modal-box .btn-confirm:hover { background: #1F4E3D; }
        .modal-box .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .test-main { grid-template-columns: 1fr; }
            .sidebar-panel { position: static; order: -1; }
            .navigator-grid { grid-template-columns: repeat(10, 1fr); }
            .question-panel { padding: 25px 20px; }
            .question-text { font-size: 17px; }
            .calculator { width: 280px; }
        }
        @media (max-width: 500px) {
            .navigator-grid { grid-template-columns: repeat(8, 1fr); }
        }
    </style>
</head>
<body>

    <div class="warning-banner" id="warningBanner">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="warningText">Warning: Do not leave this page!</span>
    </div>

    <div class="test-topbar">
        <div class="left">
            <div class="test-title">
                <i class="fas fa-pen"></i>
                <span id="testTitle">Practice Test</span>
            </div>
            <div class="timer-box" id="timerBox">
                <i class="fas fa-clock"></i>
                <span id="timerDisplay">40:00</span>
            </div>
        </div>
        <div class="progress-info">
            <span>Question <strong id="currentNum">1</strong> of <strong id="totalNum">40</strong></span>
            <button class="theme-toggle" id="themeBtn" aria-label="Toggle dark mode">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <div class="test-main">

        <div class="question-panel">
            <div class="question-header">
                <span class="question-number">Question <span id="qNum">1</span></span>
                <span class="difficulty-badge" id="difficultyBadge">medium</span>
            </div>

            <div class="question-text" id="questionText">Loading...</div>

            <div class="options-list" id="optionsList"></div>

            <div class="nav-buttons">
                <button class="btn-nav btn-prev" id="prevBtn" onclick="goPrev()">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button class="btn-nav btn-next" id="nextBtn" onclick="goNext()">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div class="sidebar-panel">
            <div class="navigator-card">
                <h3><i class="fas fa-th"></i> Question Navigator</h3>
                <div class="navigator-grid" id="navigatorGrid"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-dot answered"></div>
                        <span>Answered</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot current"></div>
                        <span>Current</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot unanswered"></div>
                        <span>Not answered</span>
                    </div>
                </div>
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-hair);">
                    <div class="stat-row">
                        <span>Answered:</span>
                        <strong id="answeredStat">0</strong>
                    </div>
                    <div class="stat-row">
                        <span>Unanswered:</span>
                        <strong id="unansweredStat">40</strong>
                    </div>
                </div>
                <button class="btn-nav btn-submit" style="width: 100%; margin-top: 15px; justify-content: center;" onclick="openSubmitModal()">
                    <i class="fas fa-paper-plane"></i> Submit Test
                </button>
            </div>
        </div>
    </div>

    <button class="calc-btn" id="calcBtn" onclick="openCalculator()" title="Open Calculator">
        <i class="fas fa-calculator"></i>
    </button>

    <div class="calculator" id="calculator">
        <div class="calc-header" id="calcHeader">
            <span><i class="fas fa-calculator"></i> Calculator</span>
            <button class="calc-close" onclick="closeCalculator()">✕</button>
        </div>
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-keys">
            <button class="calc-key clear" onclick="calcClear()">C</button>
            <button class="calc-key clear" onclick="calcBackspace()">⌫</button>
            <button class="calc-key operator" onclick="calcInput('%')">%</button>
            <button class="calc-key operator" onclick="calcInput('÷')">÷</button>

            <button class="calc-key" onclick="calcInput('7')">7</button>
            <button class="calc-key" onclick="calcInput('8')">8</button>
            <button class="calc-key" onclick="calcInput('9')">9</button>
            <button class="calc-key operator" onclick="calcInput('×')">×</button>

            <button class="calc-key" onclick="calcInput('4')">4</button>
            <button class="calc-key" onclick="calcInput('5')">5</button>
            <button class="calc-key" onclick="calcInput('6')">6</button>
            <button class="calc-key operator" onclick="calcInput('-')">−</button>

            <button class="calc-key" onclick="calcInput('1')">1</button>
            <button class="calc-key" onclick="calcInput('2')">2</button>
            <button class="calc-key" onclick="calcInput('3')">3</button>
            <button class="calc-key operator" onclick="calcInput('+')">+</button>

            <button class="calc-key zero" onclick="calcInput('0')">0</button>
            <button class="calc-key" onclick="calcInput('.')">.</button>
            <button class="calc-key equals" onclick="calcEquals()">=</button>
        </div>
    </div>

    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <div class="icon"><i class="fas fa-question"></i></div>
            <h3>Submit Test?</h3>
            <p id="submitSummary">You have answered 0 of 40 questions. Are you sure you want to submit?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeSubmitModal()">Continue Test</button>
                <button class="btn-confirm" id="confirmSubmitBtn" onclick="finalSubmit()">Submit Now</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // THEME
        // ============================================
        function applyThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('avms-theme', isDark ? 'dark' : 'light'); } catch(e){}
            applyThemeIcon();
        }
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        applyThemeIcon();

        // ============================================
        // SESSION CHECK
        // ============================================
        const studentJson = sessionStorage.getItem('cbt_student');
        const modeJson = sessionStorage.getItem('cbt_current_mode');

        if (!studentJson || !modeJson) {
            alert('Session expired. Redirecting to dashboard.');
            window.location.href = 'dashboard.html';
            throw new Error('No session');
        }

        const student = JSON.parse(studentJson);
        const modeConfig = JSON.parse(modeJson);

        // ============================================
        // STATE
        // ============================================
        let questions = [];
        let userAnswers = {};
        let currentIndex = 0;
        let timeLeft = modeConfig.time_minutes * 60;
        let timerInterval = null;
        let tabSwitchCount = 0;
        let isSubmitted = false;

        const STORAGE_KEY = `cbt_test_${modeConfig.course_id}_${modeConfig.mode}`;

        document.getElementById('testTitle').textContent =
            `${modeConfig.mode === 'exam' ? 'Examination' : 'Practice Test'} · ${modeConfig.course_code}`;

        // ANTI-CHEAT
        window.addEventListener('beforeunload', function (e) {
            if (isSubmitted) return;
            e.preventDefault();
            e.returnValue = 'Your progress will be lost. Are you sure?';
            return 'Your progress will be lost. Are you sure?';
        });

        document.addEventListener('visibilitychange', function () {
            if (isSubmitted) return;
            if (document.hidden) handleTabSwitch();
        });

        function handleTabSwitch() {
            tabSwitchCount++;
            if (tabSwitchCount === 1) {
                showWarning('⚠️ Warning: Leaving this page during a test is not allowed. If you do it again, your test will be submitted automatically.');
            } else if (tabSwitchCount >= 2) {
                showWarning('❌ You left the page again. Submitting your test now...');
                setTimeout(() => finalSubmit(true), 1500);
            }
        }

        function showWarning(text) {
            const banner = document.getElementById('warningBanner');
            document.getElementById('warningText').textContent = text;
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 6000);
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());
        document.addEventListener('selectstart', e => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
        });

        // LOAD QUESTIONS
        async function loadQuestions() {
            try {
                const { data, error } = await supabase
                    .from('cbt_questions')
                    .select('*')
                    .eq('course_id', modeConfig.course_id)
                    .eq('is_active', true);

                if (error) throw error;

                if (!data || data.length === 0) {
                    alert('No questions available for this course.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                const shuffled = shuffleArray(data);
                const selected = shuffled.slice(0, modeConfig.question_count);

                questions = selected.map(q => {
                    const rawOptions = [
                        { text: q.option_a, wasCorrect: q.correct_answer === 'A' },
                        { text: q.option_b, wasCorrect: q.correct_answer === 'B' },
                        { text: q.option_c, wasCorrect: q.correct_answer === 'C' },
                        { text: q.option_d, wasCorrect: q.correct_answer === 'D' }
                    ];
                    const shuffledContent = shuffleArray(rawOptions);
                    const letters = ['A', 'B', 'C', 'D'];
                    const newOptions = shuffledContent.map((opt, i) => ({
                        letter: letters[i],
                        text: opt.text,
                        isCorrect: opt.wasCorrect
                    }));
                    const newCorrectLetter = newOptions.find(o => o.isCorrect).letter;
                    return {
                        id: q.id,
                        text: q.question_text,
                        options: newOptions.map(o => ({ letter: o.letter, text: o.text })),
                        correct: newCorrectLetter,
                        solution: q.solution || '',
                        difficulty: q.difficulty || 'medium'
                    };
                });

                document.getElementById('totalNum').textContent = questions.length;
                restoreProgress();
                renderNavigator();
                renderQuestion();
                startTimer();
                updateProgressInfo();
            } catch (err) {
                console.warn('Error loading questions:', err);
                alert('Failed to load questions. Redirecting to dashboard.');
                window.location.href = 'dashboard.html';
            }
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // PROGRESS
        function hashQuestionIds() {
            return JSON.stringify(questions.map(q => q.id).sort());
        }

        function restoreProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                if (data.questionsHash === hashQuestionIds()) {
                    userAnswers = data.answers || {};
                    const restoredIndex = data.currentIndex || 0;
                    currentIndex = Math.min(Math.max(restoredIndex, 0), questions.length - 1);
                    timeLeft = data.timeLeft || timeLeft;
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            } catch (err) {
                console.warn('Could not restore progress:', err);
            }
        }

        function saveProgress() {
            if (isSubmitted) return;
            const data = {
                questionsHash: hashQuestionIds(),
                answers: userAnswers,
                currentIndex: currentIndex,
                timeLeft: timeLeft,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // RENDER
        function renderQuestion() {
            const q = questions[currentIndex];
            if (!q) return;

            document.getElementById('qNum').textContent = currentIndex + 1;
            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('questionText').textContent = q.text;

            const badge = document.getElementById('difficultyBadge');
            const allowedDifficulties = ['easy', 'medium', 'hard'];
            const safeDifficulty = allowedDifficulties.includes(q.difficulty) ? q.difficulty : 'medium';
            badge.textContent = safeDifficulty;
            badge.className = 'difficulty-badge ' + safeDifficulty;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = q.options.map(opt => `
                <div class="option-item ${userAnswers[currentIndex] === opt.letter ? 'selected' : ''}"
                     onclick="selectAnswer('${opt.letter}')">
                    <div class="option-letter">${opt.letter}</div>
                    <div class="option-text">${escapeHtml(opt.text)}</div>
                </div>
            `).join('');

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;

            updateNavigatorHighlight();
            updateProgressInfo();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function selectAnswer(letter) {
            userAnswers[currentIndex] = letter;
            saveProgress();
            renderQuestion();
            renderNavigator();
        }

        function goPrev() {
            if (currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function goNext() {
            if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function renderNavigator() {
            const grid = document.getElementById('navigatorGrid');
            grid.innerHTML = questions.map((_, i) => {
                const answered = userAnswers[i] ? 'answered' : '';
                const current = i === currentIndex ? 'current' : '';
                return `<button class="nav-btn ${answered} ${current}" onclick="goToQuestion(${i})">${i + 1}</button>`;
            }).join('');
            updateNavigatorHighlight();
            updateProgressInfo();
        }

        function updateNavigatorHighlight() {
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.remove('current', 'answered');
                if (userAnswers[i]) btn.classList.add('answered');
                if (i === currentIndex) btn.classList.add('current');
            });
        }

        function updateProgressInfo() {
            const answered = Object.keys(userAnswers).length;
            const total = questions.length;
            document.getElementById('answeredStat').textContent = answered;
            document.getElementById('unansweredStat').textContent = total - answered;
        }

        // TIMER
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                saveProgress();

                if (timeLeft <= 300) {
                    document.getElementById('timerBox').classList.add('warning');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showWarning('⏰ Time is up! Submitting your test...');
                    setTimeout(() => finalSubmit(true), 1500);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timerDisplay').textContent =
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // SUBMIT
        function openSubmitModal() {
            const answered = Object.keys(userAnswers).length;
            const total = questions.length;
            const unanswered = total - answered;

            let msg = `You have answered ${answered} of ${total} questions.`;
            if (unanswered > 0) {
                msg += ` ${unanswered} question${unanswered !== 1 ? 's are' : ' is'} still unanswered.`;
            }
            msg += ' Are you sure you want to submit?';

            document.getElementById('submitSummary').textContent = msg;
            document.getElementById('submitModal').classList.add('show');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.remove('show');
        }

        async function finalSubmit(auto = false) {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);

            const confirmBtn = document.getElementById('confirmSubmitBtn');
            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            }

            let score = 0;
            const detailedAnswers = [];
            questions.forEach((q, i) => {
                const userAns = userAnswers[i] || null;
                const correct = userAns === q.correct;
                if (correct) score++;

                detailedAnswers.push({
                    question: q.text,
                    options: q.options,
                    user_answer: userAns,
                    correct_answer: q.correct,
                    is_correct: correct,
                    solution: q.solution,
                    difficulty: q.difficulty
                });
            });

            const timeTaken = (modeConfig.time_minutes * 60) - timeLeft;

            const resultData = {
                mode: modeConfig.mode,
                course_id: modeConfig.course_id,
                course_code: modeConfig.course_code,
                course_name: modeConfig.course_name,
                score: score,
                total: questions.length,
                percentage: questions.length ? Math.round((score / questions.length) * 100) : 0,
                time_taken_seconds: timeTaken,
                time_allowed_seconds: modeConfig.time_minutes * 60,
                auto_submitted: auto,
                answers: detailedAnswers,
                submitted_at: new Date().toISOString()
            };

            sessionStorage.setItem('cbt_last_result', JSON.stringify(resultData));

            try {
                await supabase.from('cbt_attempts').insert([{
                    reg_no: student.reg_no,
                    course_id: modeConfig.course_id,
                    mode: modeConfig.mode,
                    score: score,
                    total_questions: questions.length,
                    time_taken_seconds: timeTaken,
                    answers_json: detailedAnswers
                }]);
            } catch (err) {
                console.warn('Could not save attempt to database:', err);
            }

            localStorage.removeItem(STORAGE_KEY);
            window.location.href = 'results.html';
        }

        // CALCULATOR
        let calcExpr = '';

        function openCalculator() {
            document.getElementById('calculator').classList.add('show');
            document.getElementById('calcBtn').style.display = 'none';
        }

        function closeCalculator() {
            document.getElementById('calculator').classList.remove('show');
            document.getElementById('calcBtn').style.display = 'flex';
        }

        function calcInput(val) {
            calcExpr += val;
            document.getElementById('calcDisplay').textContent = calcExpr || '0';
        }

        function calcClear() {
            calcExpr = '';
            document.getElementById('calcDisplay').textContent = '0';
        }

        function calcBackspace() {
            calcExpr = calcExpr.slice(0, -1);
            document.getElementById('calcDisplay').textContent = calcExpr || '0';
        }

        function calcEquals() {
            try {
                const jsExpr = calcExpr.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
                if (!/^[0-9+\-*/().% ]+$/.test(jsExpr)) throw new Error('Invalid expression');
                const result = Function('"use strict"; return (' + jsExpr + ')')();
                const rounded = Math.round(result * 1000000) / 1000000;
                calcExpr = String(rounded);
                document.getElementById('calcDisplay').textContent = calcExpr;
            } catch (err) {
                document.getElementById('calcDisplay').textContent = 'Error';
                calcExpr = '';
            }
        }

        (function makeDraggable() {
            const header = document.getElementById('calcHeader');
            const calc = document.getElementById('calculator');
            let offsetX = 0, offsetY = 0, isDragging = false;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = calc.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                calc.style.right = 'auto';
                calc.style.bottom = 'auto';
                calc.style.left = rect.left + 'px';
                calc.style.top = rect.top + 'px';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                calc.style.left = (e.clientX - offsetX) + 'px';
                calc.style.top = (e.clientY - offsetY) + 'px';
            });

            document.addEventListener('mouseup', () => isDragging = false);
        })();

        // INIT
        loadQuestions();
    </script>
</body>
</html>
