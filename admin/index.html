<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AVMS ABU Zaria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2a4a 0%, #2a4a7a 100%);
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .login-box h1 {
            color: #1a2a4a;
            font-size: 28px;
            text-align: center;
            margin-bottom: 5px;
        }
        .login-box p {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }
        .login-box .logo-text {
            text-align: center;
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box .form-group label {
            display: block;
            font-weight: 600;
            color: #1a2a4a;
            margin-bottom: 5px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e7ef;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .login-box .form-group input:focus {
            border-color: #2a4a7a;
            outline: none;
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }
        .login-box .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .login-box .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-login">
        <div class="login-box">
            <span class="logo-text">🔐</span>
            <h1>Admin Login</h1>
            <p>AVMS ABU Zaria Dashboard</p>
            
            <div id="loginError" class="error-msg">Invalid email or password. Please try again.</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" name="adminEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="adminPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
