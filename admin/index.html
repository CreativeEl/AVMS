<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AVMS ABU Zaria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2a4a 0%, #2a4a7a 100%);
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .login-box h1 {
            color: #1a2a4a;
            font-size: 28px;
            text-align: center;
            margin-bottom: 5px;
        }
        .login-box p {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }
        .login-box .logo-text {
            text-align: center;
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box .form-group label {
            display: block;
            font-weight: 600;
            color: #1a2a4a;
            margin-bottom: 5px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e7ef;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .login-box .form-group input:focus {
            border-color: #2a4a7a;
            outline: none;
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #e8491d;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-box .btn:hover {
            background: #c73d17;
        }
        .login-box .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .login-box .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-login">
        <div class="login-box">
            <span class="logo-text">🔐</span>
            <h1>Admin Login</h1>
            <p>AVMS ABU Zaria Dashboard</p>
            
            <div id="loginError" class="error-msg">Invalid email or password. Please try again.</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" name="adminEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="adminPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // ADMIN LOGIN - WORKING VERSION
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔐 Admin login page loaded');
            
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');
            
            // Check if already logged in - use BOTH session and local storage
            if (sessionStorage.getItem('adminLoggedIn') === 'true' || localStorage.getItem('adminLoggedIn') === 'true') {
                console.log('✅ Already logged in, redirecting to dashboard...');
                window.location.href = 'dashboard.html';
                return;
            }
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorDiv.classList.remove('show');
                
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;
                
                console.log('📧 Login attempt:', email);
                
                // Admin credentials
                const admins = [
                    { email: 'admin@avmsabu.com', password: 'admin123' },
                    { email: 'avms@abu.edu.ng', password: 'avms2024' }
                ];
                
                const admin = admins.find(a => a.email === email && a.password === password);
                
                if (admin) {
                    console.log('✅ Login successful!');
                    
                    // Set BOTH sessionStorage AND localStorage for maximum persistence
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminEmail', email);
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminEmail', email);
                    
                    console.log('📦 Session stored. Redirecting to dashboard...');
                    window.location.href = 'dashboard.html';
                } else {
                    console.log('❌ Login failed');
                    errorDiv.textContent = '❌ Invalid email or password. Please try again.';
                    errorDiv.classList.add('show');
                }
            });
        });
    </script>
</body>
</html>
