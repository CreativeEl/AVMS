<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — AVMS ABU Zaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #142f25 0%, #1F4E3D 45%, #2D6B54 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .admin-login::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .admin-login::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-box {
            background: white;
            padding: 44px 40px;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(201, 169, 97, 0.25);
            position: relative;
            z-index: 1;
            border-top: 4px solid #C9A961;
        }

        .login-box .logo-text {
            text-align: center;
            font-size: 52px;
            display: block;
            margin-bottom: 14px;
            line-height: 1;
        }

        .login-box h1 {
            font-family: Georgia, serif;
            color: #1F4E3D;
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-box > p {
            color: #888;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .login-box .form-group {
            margin-bottom: 18px;
        }

        .login-box .form-group label {
            display: block;
            font-weight: 600;
            color: #1F4E3D;
            margin-bottom: 7px;
            font-size: 13.5px;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #e3e0d2;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
            background: #FBF8EE;
            color: #1a1a1a;
        }

        .login-box .form-group input::placeholder {
            color: #a8a89a;
        }

        .login-box .form-group input:focus {
            border-color: #C9A961;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
        }

        .login-box .btn {
            width: 100%;
            padding: 15px;
            font-size: 15px;
            background: #2D6B54;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.28s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: inherit;
            margin-top: 6px;
        }

        .login-box .btn:hover {
            background: #1F4E3D;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(31, 78, 61, 0.25);
        }

        .login-box .btn:active {
            transform: translateY(0);
        }

        .login-box .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13.5px;
            font-weight: 500;
            display: none;
            border-left: 4px solid #dc3545;
        }

        .login-box .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f0ede0;
            font-size: 12.5px;
            color: #888;
        }

        .login-footer a {
            color: #2D6B54;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: #C9A961;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px;
                border-radius: 12px;
            }
            .login-box h1 {
                font-size: 26px;
            }
            .login-box .logo-text {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-login">
        <div class="login-box">
            <span class="logo-text">🔐</span>
            <h1>Admin Login</h1>
            <p>AVMS ABU ZARIA · DASHBOARD</p>

            <div id="loginError" class="error-msg">Invalid email or password. Please try again.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" name="adminEmail" placeholder="Enter your email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="adminPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to AVMS Homepage</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔐 Login page loaded');

            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');

            // Pre-fill from session if "remember" flag exists
            const rememberedEmail = localStorage.getItem('adminEmail');
            if (rememberedEmail) {
                document.getElementById('adminEmail').value = rememberedEmail;
                document.getElementById('adminPassword').focus();
            } else {
                document.getElementById('adminEmail').focus();
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorDiv.classList.remove('show');

                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;

                const admins = [
                    { email: 'admin@avmsabu.com', password: 'admin123' },
                    { email: 'avms@abu.edu.ng', password: 'avms2024' }
                ];

                const admin = admins.find(a => a.email === email && a.password === password);

                if (admin) {
                    console.log('✅ Login successful!');
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminEmail', email);
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminEmail', email);
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = '❌ Invalid email or password.';
                    errorDiv.classList.add('show');
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('adminPassword').focus();
                }
            });
        });
    </script>
</body>
</html>
